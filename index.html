<body>
<header><div class="hrow"><div class="toprow"><h1>ДиаРазбор</h1><button class="gear" data-act="tab:set" aria-label="Настройки" id="gearBtn"><span aria-hidden="true">⚙</span> Настройки</button></div><div class="tabs" role="tablist" id="tabs"></div></div></header>
<main class="wrap" id="app"><p class="muted" style="padding:50px 0">Загрузка…</p></main>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" multiple accept=".zip,application/zip,.xml,.json,.csv,.txt,.xlsx,.xls,.html,.htm,application/json,text/xml,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/html" hidden>
<input type="file" id="bkIn" accept=".json,application/json" hidden>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = v => (Math.round(v*10)/10).toFixed(1).replace('.', ',');
const fU = v => String(Math.round(v*10)/10).replace('.', ',');
const MG = 18.016, MIN = 60000, H = 3600000;
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dRu = t => new Date(t).toLocaleDateString('ru-RU', {day:'numeric', month:'long', weekday:'short'});
const dShort = t => new Date(t).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
const uid = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let toastT; function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 3500); }

const S = { tab:'diary', busy:false, prog:0, progText:'', mode:'local', db:null, base:null, sample:null,
  res:null, demo:false, filter:'all', notes:{}, ai:'', aiBusy:false, aiErr:'', epv:'days', dayF:null, chat:[], draft:'', aiMode:'', pendingQ:'',
  set:{mode:null, rapid:'Короткий', long:'Длинный', carb:'g', xe:12, days:14}, entries:[], gl:{}, dirty:true, day:null, sheet:null, demoStore:null };
const num = s2 => { if (s2 == null) return NaN; s2 = String(s2).trim().replace(/\s/g, '').replace(',', '.'); return s2 === '' ? NaN : Number(s2); };
const tmin = d => Math.round(d.getTime() / 60000);
const ymKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth()+1); };
const startDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
async function readText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder('utf-8').decode(buf);
  if ((t.match(/\uFFFD/g) || []).length > 5){ try { t = new TextDecoder('windows-1251').decode(buf); } catch(e){} }
  return t.replace(/^\uFEFF/, '');
}
function splitCSV(text, dl){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === dl){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function parseLibre(text){
  const head = text.split(/\r?\n/).slice(0, 6);
  const cnt = ch => head.reduce((s, l) => s + l.split(ch).length - 1, 0);
  let dl = ','; if (cnt(';') > cnt(',')) dl = ';'; if (cnt('\t') > Math.max(cnt(';'), cnt(','))) dl = '\t';
  const rows = splitCSV(text, dl);
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 8); i++){
    const r = rows[i].map(x => x.toLowerCase());
    if (r.length >= 5 && r.some(x => /glucose|глюкоз/.test(x)) && r.some(x => /time|врем|дат|метка/.test(x))){ hi = i; break; }
  }
  if (hi < 0) throw new Error('В файле не найдена строка с заголовками столбцов. Убедитесь, что это CSV-выгрузка из LibreView.');
  const H = rows[hi].map(x => x.toLowerCase().trim());
  const nonNum = /non-numeric|нечислов|не числов|нецифров/;
  const find = (re, not) => H.findIndex(h => re.test(h) && !(not && not.test(h)));

function buildTableImport(preview){

  if (!has('bg') && !has('carbs') && !has('rapid') && !has('long') && !has('note')) { res.err = 'Укажите хотя бы один столбец с данными: глюкоза, углеводы, инсулин или заметка.'; return res; }
  const ci = r => R.indexOf(r);
  const bgVals = [];
  for (const row of t.rows.slice(t.hi + 1)){
    const ts = has('dt') ? parseDateCell(row[ci('dt')], has('time') ? row[ci('time')] : '') : parseDateCell(row[ci('date')], has('time') ? row[ci('time')] : '');
    if (!ts){ res.bad++; continue; }
    if (has('bg')){ const v = num(row[ci('bg')]); if (v > 0) bgVals.push([ts, v]); }
    if (has('carbs')){ let c = num(row[ci('carbs')]); if (c > 0){ const cu = t.carbUnit; if (cu === 'xe') c = c * S.set.xe; if (c < 500) res.e.push({t:ts, type:'carbs', g:Math.round(c*10)/10, src:'table'}); } }
    if (has('rapid')){ const u = num(row[ci('rapid')]); if (u > 0 && u < 100) res.e.push({t:ts, type:'rapid', u, src:'table'}); }
    if (has('long')){ const u = num(row[ci('long')]); if (u > 0 && u < 150) res.e.push({t:ts, type:'long', u, src:'table'}); }
    if (has('note')){ const n = String(row[ci('note')] || '').trim(); if (n) res.e.push({t:ts, type:'note', note:n.slice(0, 500), src:'table'}); }
  }
  if (bgVals.length){ const sorted = bgVals.map(x => x[1]).sort((a, b) => a - b); const med = sorted[Math.floor(sorted.length/2)]; const mg = med > 30;
    for (const [ts, v] of bgVals){ const m = mg ? v / MG : v; if (m > 1 && m < 35) res.g.push([ts, m]); } }

  return res;
}

}

const LIC_PUB = {"kty": "EC", "crv": "P-256", "x": "r0MRcLSfxrPPsSZkD0tOd1wE9_YRy2K9G1eWy5f04hc", "y": "JyXp2AmXbWC_CgLEKIwQTZH8IKvQb06tqKMfBQvwkS4"};
const b64uDec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
async function verifyKey(key){
  key = String(key || '').trim().replace(/\s+/g, '');
  const m = /^DR1-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(key);
  if (!m) return {ok:false, err:'Ключ указан не полностью или с ошибкой. Скопируйте его целиком, начиная с DR1-.'};
  if (!(window.crypto && crypto.subtle)) return {ok:false, err:'Проверка ключа недоступна в этом окне. Откройте приложение по ссылке https://.'};

    const p = JSON.parse(new TextDecoder().decode(b64uDec(m[1])));

  <h2>Какие датчики подходят</h2>
  <p>ДиаРазбор берёт глюкозу из «Здоровья», поэтому подходит любой датчик, приложение которого записывает туда данные: <b>Libre</b> (через xDrip4iOS, Juggluco, DiaBox), <b>Dexcom</b>, <b>Ottai</b>, <b>Sibionics</b>, <b>Linx</b> и другие, а также петля и глюкометры с синхронизацией.</p>
  <ol class="sc-steps">
    <li>В приложении датчика найдите в настройках или профиле пункт <b>«Apple Здоровье»</b> / <b>«Health»</b> / <b>«Синхронизация»</b> и включите запись глюкозы.</li>

const MEALS = [['b','Завтрак','#5BC0BE'],['l','Обед','#F4A259'],['d','Ужин','#9B5DE5'],['s','Перекусы и ночь','#8D99AE']];
const mealOf = t => { const h = new Date(t).getHours(); return h >= 5 && h < 11 ? 'b' : h >= 11 && h < 16 ? 'l' : h >= 16 && h < 23 ? 'd' : 's'; };

function carbsByDay(from, to){
  const days = {};

    const d0 = startDay(e.t); const D = days[d0] || (days[d0] = {d:d0, b:0, l:0, d_:0, s:0, n:0, total:0, hours:new Array(24).fill(0)});

function carbsDayChart(list){

function carbsHourChart(hours, glu){

function carbsHtml(k, from, to, forReport){

/* ===================== Nightscout: автоматическая загрузка данных ===================== */
const nsBase = () => String(S.set.nsUrl || '').trim().replace(/\/+$/, '');
const nsOn = () => !!(S.set.nsUrl && (S.set.nsToken || S.set.nsPublic));
async function nsGet(path, params){
  const pq = Object.assign({}, params || {}, S.set.nsToken ? {token: S.set.nsToken} : {});
  const direct = () => fetch(nsBase() + path + '?' + new URLSearchParams(pq).toString(), {cache:'no-store'});
  /* Если Nightscout не разрешает запросы с других сайтов (нет cors), браузер не даст их прочитать — тогда идём через посредника на сервере ДиаРазбора */
  const proxied = () => fetch(APP_CONFIG.nsProxy + '?' + new URLSearchParams(Object.assign({u: nsBase(), p: path}, pq)).toString(), {cache:'no-store'});
  let r;
  if (S.set.nsViaProxy && APP_CONFIG.nsProxy) r = await proxied();
  else {
    try { r = await direct(); }
    catch(e){ if (!APP_CONFIG.nsProxy) throw e; r = await proxied(); if (r.ok){ S.set.nsViaProxy = true; persist('settings'); } }
  }
  if (r.status === 401 || r.status === 403) throw new Error('auth');
  if (r.status === 502 || r.status === 504) throw new Error('down');
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
function nsBasalAt(prof, t){
  // плановый базал из профиля Loop (по часовому поясу профиля)
  if (!prof || !prof.basal || !prof.basal.length) return null;
  let sec;
  try { const p = new Intl.DateTimeFormat('en-GB', {timeZone: prof.timezone || undefined, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'}).formatToParts(new Date(t));
    const g = k => +p.find(x => x.type === k).value; sec = g('hour')*3600 + g('minute')*60 + g('second'); }
  catch(e){ const d = new Date(t); sec = d.getHours()*3600 + d.getMinutes()*60; }
  let rate = prof.basal[0].value;
  for (const b of prof.basal){ const s = b.timeAsSeconds != null ? +b.timeAsSeconds : (String(b.time).split(':').reduce((a, x, i) => a + (+x) * (i ? 60 : 3600), 0)); if (sec >= s) rate = +b.value; }
  return rate;
}
async function nsSync(manual){
  if (!nsOn() || S.nsBusy) return;
  S.nsBusy = true; if (manual){ S.nsMsg = 'Загружаю…'; render(); }
  try {
    const now = Date.now();
    const from = S.set.nsLast ? Math.max(now - 30*864e5, S.set.nsLast - 6*3600e3) : now - 30*864e5;
    const [sgv, tr, profs] = await Promise.all([
      nsGet('/api/v1/entries/sgv.json', {'find[date][$gte]': from, count: 30000}),
      nsGet('/api/v1/treatments.json', {'find[created_at][$gte]': new Date(from - 6*3600e3).toISOString(), count: 10000}),
      nsGet('/api/v1/profile.json', {count: 1}).catch(() => [])
    ]);
    // глюкоза
    const G = []; for (const x of (Array.isArray(sgv) ? sgv : [])){ const t = x.date || Date.parse(x.dateString || ''); const v = x.sgv / MG; if (t >= from && v > 1 && v < 35) G.push([t, v]); }
    const ag = G.length ? mergeGlucose(G, 'Nightscout') : 0;
    // события
    const loop = S.set.mode === 'loop'; const ents = []; const temps = [];
    for (const x of (Array.isArray(tr) ? tr : [])){
      const t = Date.parse(x.created_at || x.timestamp || ''); if (!(t > 0)) continue;
      const et = x.eventType || '';
      if (/Temp Basal/i.test(et)){ if (x.rate != null || x.absolute != null) temps.push({t, rate: +(x.absolute != null ? x.absolute : x.rate), dur: +(x.duration || 0)}); continue; }
      if (t < from) continue;
      if (x.carbs > 0) ents.push({t, type:'carbs', g: Math.round(x.carbs*10)/10, src:'ns'});
      if (x.insulin > 0) ents.push({t, type:'rapid', u: Math.round(x.insulin*100)/100, auto: (x.automatic || /SMB|Automatic/i.test(et)) || undefined, src:'ns'});
      if (/Exercise/i.test(et)) ents.push({t, e: t + (x.duration || 30)*60000, type:'act', note:'тренировка', src:'ns'});
      if (/Site Change/i.test(et)) ents.push({t, type:'note', note:'Замена набора', src:'ns'});
      if (/Sensor (Start|Change)/i.test(et)) ents.push({t, type:'note', note:'Замена сенсора', src:'ns'});
      if (x.notes && /Note|Announcement/i.test(et)) ents.push({t, type:'note', note: String(x.notes).slice(0, 500), src:'ns'});
    }
    // базал: временные базалы Loop + плановый базал профиля в промежутках, кусками по 5 минут
    if (loop){
      const p0 = (Array.isArray(profs) ? profs : [])[0]; const prof = p0 && p0.store ? p0.store[p0.defaultProfile] || Object.values(p0.store)[0] : null;
      if (prof && p0) prof.timezone = prof.timezone || p0.timezone;
      // Только корректные интервалы; последнее начавшееся событие имеет приоритет.
      const validTemps = temps.filter(x => Number.isFinite(x.t) && Number.isFinite(x.rate) && x.rate >= 0 && Number.isFinite(x.dur) && x.dur > 0 && x.dur <= 1440);
      temps.length = 0; temps.push(...validTemps.sort((a, b) => a.t - b.t));
      // Если профиль отсутствует, не выдаём неполную сумму за полную суточную дозу.
      // Начинаем с from, включая плановый базал до первого временного события.
      const end = now;
      const startB = from;
      const STEP = 5*60000; let i = 0;
      for (let s = startB - startB % STEP; s < end; s += STEP){
        const e2 = Math.min(s + STEP, end); let u = 0;
        let hasRate = true;
        // доля каждого временного базала внутри куска [s, e2)
        let cur = Math.max(s, from);
        while (cur < e2){
          while (i + 1 < temps.length && temps[i+1].t <= cur) i++;
          const tb = temps[i] && temps[i].t <= cur ? temps[i] : null;
          const tbEnd = tb ? Math.min(tb.t + tb.dur*60000, i + 1 < temps.length ? temps[i+1].t : Infinity) : (temps.length && temps[0].t > cur ? temps[0].t : Infinity);
          const nextStart = i + 1 < temps.length && temps[i+1].t > cur ? temps[i+1].t : Infinity;
          const segEnd = Math.min(e2, tb && tbEnd > cur ? tbEnd : nextStart);
          const rate = tb && tbEnd > cur ? tb.rate : nsBasalAt(prof, cur);
          if (rate == null || !Number.isFinite(rate) || rate < 0) hasRate = false;
          else if (segEnd > cur) u += rate * (segEnd - cur) / 3600e3;
          if (segEnd <= cur) break; cur = segEnd;
        }
        if (hasRate && u > 0.0005) ents.push({t: Math.max(s, from), type:'basal', u: Math.round(u*1000000)/1000000, auto:true, src:'ns'});
      }
    }
    // заменяем данные инсулина и углеводов за загруженный период (без дублей с «Здоровьем»)
    const firstT = ents.length ? Math.min(...ents.filter(e => e.type !== 'note').map(e => e.t).concat([Infinity])) : Infinity;
    const cut = Math.max(from, isFinite(firstT) ? firstT - 60000 : from);
    const months = new Set(); const keep = [];
    for (const e of S.entries){
      const repl = e.t >= cut && (e.src === 'ns' || (e.src === 'health' && ['rapid','basal','long','carbs'].includes(e.type)));
      if (repl) months.add(ymKey(e.t)); else keep.push(e);
    }
    S.entries = keep; for (const e of ents){ e.id = uid(); S.entries.push(e); months.add(ymKey(e.t)); }
    S.entries.sort((a, b) => a.t - b.t); for (const m of months) persist('e-' + m);
    S.set.nsLast = now; persist('settings');
    S.nsErr = ''; S.nsMsg = `Загружено: показаний ${ag}, событий ${ents.length}.`; S.dirty = true; S.lastSrc = ['Nightscout'];
    if (manual) toast(S.nsMsg, 4000);

function mergeGlucose(G, source = 'неизвестный импорт'){
  const byM = {};
  for (const [t, v] of G){
    if (!Number.isFinite(t) || !Number.isFinite(v) || v <= 0.5 || v >= 40) continue;
    const m = ymKey(t);
    (byM[m] = byM[m] || []).push([Math.round(t/60000), Math.round(v*10)]);
  }

  const audit = {incoming:0, added:0, exactDuplicates:0, nearDuplicates:0, conflicts:0};
  const touched = new Set();
  const conflictSamples = [];
  // Work on copies; compare against the adjacent calendar months as well.
  const working = {};
  const monthAt = minute => ymKey(minute*60000);
  const getMonth = m => working[m] || (working[m] = (S.gl[m] || []).slice().sort((x,y)=>x[0]-y[0]));
  const nearest = (arr, minute) => {
    let lo=0, hi=arr.length;
    while (lo<hi){ const mid=(lo+hi)>>1; if(arr[mid][0]<minute) lo=mid+1; else hi=mid; }
    return {lo, candidates:[arr[lo-1],arr[lo]].filter(Boolean)};
  };

    const [y, mo] = m.split('-').map(Number);
    const prev = new Date(y, mo-2, 1), next = new Date(y, mo, 1);
    return [ymKey(prev.getTime()), m, ymKey(next.getTime())];
  };
  // Chronological order across all months prevents month-boundary order dependence
  // within a single import. Existing saved measurements still take precedence.
  const incoming = Object.values(byM).flat().sort((x,y)=>x[0]-y[0]);
  audit.incoming = incoming.length;
  for (const p of incoming){
    const m=monthAt(p[0]);
    const out=getMonth(m);
    const pos=nearest(out,p[0]);
    const candidates=[];
    for (const key of adjacentMonths(m)){
      const arr=getMonth(key);
      candidates.push(...nearest(arr,p[0]).candidates);
    }
    const near=candidates.filter(q=>Math.abs(q[0]-p[0])<4)
      .sort((x,y)=>Math.abs(x[0]-p[0])-Math.abs(y[0]-p[0]))[0];
    if (near){
      if (near[0]===p[0] && near[1]===p[1]) audit.exactDuplicates++;
      else if (near[1]===p[1]) audit.nearDuplicates++;
      else {
        audit.conflicts++;
        if (conflictSamples.length < 50) conflictSamples.push({minute:p[0], incoming:p[1], retained:near[1], retainedMinute:near[0], source:String(source).slice(0,60), retainedSource:'неизвестен (старое хранилище)'});
      }
    } else {out.splice(pos.lo,0,p); touched.add(m); added++; audit.added++;}

    const entry = {at:Date.now(), source:String(source).slice(0,60), count:audit.conflicts, samples:conflictSamples};

    persist('gl-conflicts');
  }
  return added;
}

/* ===================== analysis ===================== */
function analyze(raw){
  const G = []; for (const p of raw.G.sort((a, b) => a[0] - b[0])){ const l = G[G.length-1]; if (!l || p[0] - l[0] >= 45000) G.push(p); }
  const I = raw.I.sort((a, b) => a.t - b.t);
  const Cr = raw.C.sort((a, b) => a.t - b.t); const C = [];
  for (const c of Cr){ const l = C[C.length-1]; if (l && c.t - l.t < 20*MIN) l.g += c.g; else C.push({t:c.t, g:c.g}); }
  const W = raw.W.sort((a, b) => a.t - b.t);
  const T = G.map(p => p[0]);
  const lb = t => { let lo = 0, hi = T.length; while (lo < hi){ const m = (lo+hi) >> 1; if (T[m] < t) lo = m+1; else hi = m; } return lo; };
  const at = (t, tol = 12*MIN) => { const i = lb(t); let best = null, bd = tol; for (const j of [i-1, i]) if (j >= 0 && j < T.length && Math.abs(T[j]-t) <= bd){ bd = Math.abs(T[j]-t); best = G[j][1]; } return best; };
  const range = (a, b) => G.slice(lb(a), lb(b));
  const ins = (a, b, f) => I.filter(x => x.t >= a && x.t < b && (!f || f(x))).reduce((s, x) => s + x.u, 0);
  const bolusList = (a, b) => I.filter(x => x.kind === 'bolus' && x.u >= 0.5 && x.t >= a && x.t < b);
  const carbsIn = (a, b) => C.filter(c => c.t >= a && c.t < b);
  const wkIn = (a, b) => W.filter(w => w.e >= a && w.t < b);
  const ser = (a, b) => { const r = range(a, b); const step = Math.max(1, Math.round(r.length / 60)); return r.filter((_, i) => i % step === 0).map(p => [Math.round((p[0]-a)/MIN), Math.round(p[1]*10)/10]); };
  const marks = (a, b) => ({c: carbsIn(a, b).map(c => [Math.round((c.t-a)/MIN), Math.round(c.g)]), b: I.filter(x => x.kind === 'bolus' && x.t >= a && x.t < b && x.u >= 0.3).map(x => [Math.round((x.t-a)/MIN), Math.round(x.u*10)/10]), l: I.filter(x => x.kind === 'basal' && x.t >= a && x.t < b).map(x => [Math.round((x.t-a)/MIN), Math.round(x.u*10)/10]), w: wkIn(a, b).map(w => [Math.round((Math.max(w.t, a)-a)/MIN), Math.round((Math.min(w.e, b)-a)/MIN)])});
  const F = []; const used = [];
  const dk = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
  const recDays = new Set(I.map(x => dk(x.t)).concat(C.map(c => dk(c.t))));
  const covered = t => recDays.has(dk(t));
  const NOCOV = 'За этот день нет записей об инсулине и еде, поэтому причины указаны только по графику глюкозы.';
  const block = t => { const h = new Date(t).getHours(); return h < 6 ? 'ночь' : h < 11 ? 'утро' : h < 17 ? 'день' : 'вечер'; };
  const meal = t => { const h = new Date(t).getHours(); return h >= 5 && h < 11 ? 'завтрак' : h >= 11 && h < 16 ? 'обед' : h >= 16 && h < 23 ? 'ужин' : 'поздний перекус'; };
  const add = f => { f.id = 'f' + f.t + f.kind; f.block = block(f.t); F.push(f); };

  /* --- 1. meals --- */
  let mealsOk = 0, mealsTotal = 0; const mealPre = [], mealPost = [];
  for (const c of C){
    if (c.g < 8) continue;
    const pre = at(c.t, 15*MIN); if (pre == null) continue;
    const win = range(c.t, c.t + 240*MIN); if (win.length < 12) continue;
    mealsTotal++;
    { const p2 = at(c.t + 120*MIN); mealPre.push(pre); if (p2 != null) mealPost.push(p2); }
    let pk = win[0], mn = win[0]; for (const p of win){ if (p[1] > pk[1]) pk = p; if (p[1] < mn[1]) mn = p; }
    const tPk = (pk[0]-c.t)/MIN, rise = pk[1]-pre, v180 = at(c.t + 180*MIN), v120 = at(c.t + 120*MIN);
    const bl = bolusList(c.t - 60*MIN, c.t + 60*MIN); const bU = bl.reduce((s, x) => s + x.u, 0);
    const bOff = bl.length ? Math.round((bl[0].t - c.t)/MIN) : null;
    const wk = wkIn(c.t - 30*MIN, c.t + 240*MIN);
    const name = meal(c.t), cg = Math.round(c.g);
    const lowMin = mn[1] < 3.9 ? (mn[0]-c.t)/MIN : null;
    const base = {t:c.t, a:c.t - 60*MIN, ser:ser(c.t - 60*MIN, c.t + 300*MIN), mk:marks(c.t - 60*MIN, c.t + 300*MIN), meal:name, carbs:cg};
    const facts = [`Введено ${cg} г углеводов`, bl.length ? `короткий инсулин ${fU(bU)} ед ${bOff < -2 ? `за ${-bOff} мин до записи углеводов` : bOff > 2 ? `через ${bOff} мин после начала еды` : 'одновременно с едой'}` : 'запись о коротком инсулине рядом с едой не найдена', `глюкоза до еды ${f1(pre)}`];
    if (lowMin != null){
      const causes = [];
      if (wk.length) causes.push(`Нагрузка рядом с едой (${wk[0].type} в ${hm(wk[0].t)}): она усиливает действие инсулина.`);
      if (rise < 2) causes.push('Углеводы, вероятно, переоценены: заметного подъёма после еды не было, а снижение наступило — инсулина оказалось больше, чем нужно на фактически съеденное.');
      if (bOff != null && bOff <= -15 && lowMin < 90) causes.push(`Болюс сделан рано (за ${-bOff} мин), а еда усваивалась медленнее, чем подействовал инсулин.`);
      if (rise >= 2) causes.push('Еда была быстрой: углеводы усвоились за 1–2 часа, а короткий инсулин продолжил действовать ещё несколько часов.');
      causes.push('Съедено меньше, чем введено (не доели, заменили блюдо).');
      if (pre < 5.5) causes.push(`Глюкоза перед едой уже была невысокой (${f1(pre)}).`);
      add(Object.assign(base, {kind:'meal_low', sev:3, title:`Снижение после еды (${name})`, what:`${facts.join(', ')}. Через ${Math.round(lowMin)} мин глюкоза опустилась до ${f1(mn[1])}.`, causes, check:['Сколько вы на самом деле съели по сравнению с введённым?','Была ли активность в течение 3 часов после еды?']}));
      continue;
    }
    if (rise >= 4 && pk[1] > 10){
      const causes = []; let kind = 'meal_spike';
      if (tPk < 120){
        if (bl.length === 0) causes.push('Нет записи о коротком инсулине на эту еду: если укол был пропущен или забыт — это главная причина.');
        else if (bOff > 5) causes.push(`Укол сделан после еды (через ${bOff} мин): быстрый подъём начался раньше, чем подействовал инсулин.`);
        else if (bOff > -10) causes.push('Укол без запаса времени: инсулину из ручки нужно 15–30 минут, чтобы начать действовать, — обсудите с врачом, за сколько до еды колоть.');
        causes.push('В блюде много быстрых углеводов (сладкое, белый хлеб, сок, картофельное пюре).');
        if (v120 != null && v120 > 10) causes.push('Углеводы недооценены: глюкоза осталась высокой и через 2 часа.');
        else causes.push('Количество углеводов, похоже, оценено верно: через 2 часа глюкоза вернулась.');
      } else {
        kind = 'meal_late';
        causes.push('Жирное или белковое блюдо (пицца, плов, жареное, сливочный соус): жир замедляет всасывание, и подъём сдвигается на 2–4 часа.');
        causes.push('Короткий инсулин успел отработать к моменту, когда жиры «дотянули» углеводы: при жирной еде подъём наступает уже после пика действия инсулина. Такие блюда стоит обсудить с врачом (иногда используют разделённое введение).');
        causes.push('Углеводы недооценены.');
      }
      if (wk.length === 0 && new Date(c.t).getHours() < 11) causes.push('Утром чувствительность к инсулину часто ниже — завтраки обычно требуют больше инсулина на те же углеводы.');
      add(Object.assign(base, {kind, sev:2, title: kind === 'meal_late' ? `Поздний подъём после еды (${name})` : `Подъём после еды (${name})`, what:`${facts.join(', ')}. Пик ${f1(pk[1])} через ${Math.round(tPk)} мин (рост на ${f1(rise)}).${v180 != null ? ` Через 3 часа ${f1(v180)}.` : ''}`, causes, check:['Что именно было в тарелке?', 'Когда вы сделали укол относительно начала еды?']}));
      continue;
    }
    mealsOk++;
  }

  /* --- 2. hypos --- */
  const hypos = []; let run = null;
  for (const p of G){
    if (p[1] < 3.9){ if (run && p[0] - run.e <= 20*MIN){ run.e = p[0]; if (p[1] < run.min) run.min = p[1]; } else { if (run) hypos.push(run); run = {s:p[0], e:p[0], min:p[1]}; } }
  }
  if (run) hypos.push(run);
  for (const h of hypos.filter(h => h.e - h.s >= 10*MIN)){
    const near = F.find(f => f.kind === 'meal_low' && h.s - f.t < 240*MIN && h.s >= f.t);
    const after = range(h.e, h.e + 120*MIN); const rb = after.length ? Math.max(...after.map(p => p[1])) : null;
    if (rb != null && rb > 10){
      add({kind:'rebound', sev:2, t:h.s, a:h.s - 90*MIN, ser:ser(h.s - 90*MIN, h.e + 180*MIN), mk:marks(h.s - 90*MIN, h.e + 180*MIN), title:'Откат после гипогликемии', what:`Глюкоза снизилась до ${f1(h.min)}, а в течение 2 часов после выхода поднялась до ${f1(rb)}.`, causes:['Гипогликемию купировали большим количеством углеводов, чем было нужно. Обычно достаточно небольшой порции быстрых углеводов с повторной проверкой через 15 минут — сколько именно вам, лучше уточнить у врача.', 'После гипогликемии организм выбрасывает гормоны, повышающие сахар, — это добавляется к съеденным углеводам.', 'Затем могли поставить коррекцию, и сахар «качнуло» — такие качели лучше разбирать с врачом.'], check:['Сколько углеводов вы съели при гипогликемии?','Вносили ли вы их в петлю?']});
    }
    if (near) continue;
    if (!covered(h.s - 4*H)){
      const hr2 = new Date(h.s).getHours();
      add({kind:'hypo', sev:3, t:h.s, a:h.s - 4*H, ser:ser(h.s - 4*H, h.e + 90*MIN), mk:marks(h.s - 4*H, h.e + 90*MIN), nocov:true, title: hr2 < 6 ? 'Ночная гипогликемия' : 'Гипогликемия', what:`Глюкоза ниже 3,9 с ${hm(h.s)} до ${hm(h.e)}, минимум ${f1(h.min)}. ${NOCOV}`, causes:[(range(h.s - 4*H, h.s).some(p => p[1] > 10) ? 'Перед снижением глюкоза была выше 10 — возможно, её активно снижали коррекцией или петля добавляла инсулин, и его действие наложилось.' : 'Снижение без предшествующего высокого сахара: вероятные причины — укол на еду, которой оказалось меньше, или физическая активность.'), 'Физическая нагрузка в предыдущие часы.', 'Сенсор мог занижать показания (сон на сенсоре).'], check:['Что происходило за 2–4 часа до снижения: еда, болюс, движение?']});
      continue;
    }
    const bl = bolusList(h.s - 4*H, h.s - 20*MIN); const cb = carbsIn(h.s - 4*H, h.s); const wk = wkIn(h.s - 8*H, h.s);
    const hr = new Date(h.s).getHours(); const longs = I.filter(x => x.kind === 'basal' && x.t >= h.s - 30*H && x.t < h.s); const rap4 = I.filter(x => x.kind === 'bolus' && x.t >= h.s - 4*H && x.t < h.s);
    const causes = []; let what = `Глюкоза ниже 3,9 с ${hm(h.s)} до ${hm(h.e)}, минимум ${f1(h.min)}.`;
    if (bl.length && !cb.length){ const u = bl.reduce((s, x) => s + x.u, 0); what += ` За ${Math.round((h.s - bl[0].t)/MIN)} мин до этого — короткий инсулин ${fU(u)} ед без записанной еды.`;
      causes.push(rap4.length >= 2 ? `Наложение уколов: за 4 часа до снижения было ${rap4.length} инъекции короткого инсулина. Предыдущая доза ещё действовала, когда сделали следующую.` : 'Коррекция оказалась избыточной: в момент укола ещё действовал инсулин, введённый на еду, или высокий сахар был вызван временной причиной (стресс, поздний подъём после еды).'); }
    else if (rap4.length >= 2) causes.push(`За 4 часа до снижения было ${rap4.length} инъекции короткого инсулина — их действие могло наложиться.`);
    if (wk.length){ causes.push(`Физическая нагрузка: ${wk[wk.length-1].type} в ${hm(wk[wk.length-1].t)}. После нагрузки чувствительность к инсулину повышается на много часов${hr < 7 ? ', поэтому снижения часто происходят ночью' : ''}.`); }
    if (hr < 6 && !bl.length) causes.push(`Ночью без коррекций снижение часто связано с длинным инсулином: его доза или время введения могут не совпадать с ночной потребностью${longs.length ? ` (последняя запись: ${fU(longs[longs.length-1].u)} ед в ${hm(longs[longs.length-1].t)})` : ''}. Покажите такие ночи врачу.`);
    if (longs.length >= 2) causes.push(`За последние сутки записано ${longs.length} инъекции длинного инсулина — проверьте, не было ли случайного повторного укола.`);
    if (hr < 6) causes.push('Алкоголь вечером может вызывать отложенные ночные снижения.');
    causes.push('Сенсор мог занижать показания (компрессия при сне на сенсоре, первые сутки работы). Проверьте глюкометром, если снижение не ощущалось.');
    add({kind:'hypo', sev:3, t:h.s, a:h.s - 4*H, ser:ser(h.s - 4*H, h.e + 90*MIN), mk:marks(h.s - 4*H, h.e + 90*MIN), title: hr < 6 ? 'Ночная гипогликемия' : 'Гипогликемия', what, causes, check:['Было ли снижение подтверждено глюкометром и ощущалось ли?','Что происходило за 3–6 часов до этого: нагрузка, алкоголь, коррекция, укол длинного?']});
  }

  /* --- 3. unannounced rises --- */
  for (let i = 0; i < G.length; i++){
    const [t0, v0] = G[i]; if (v0 > 9) continue;
    let j = i; while (j + 1 < G.length && G[j+1][0] - t0 <= 60*MIN) j++;
    const [t1, v1] = G[j]; if (v1 - v0 < 3 || v1 < 9.5) continue;
    if (!covered(t0)) continue;
    if (carbsIn(t0 - 90*MIN, t1 + 20*MIN).length) continue;
    if (range(t0 - 120*MIN, t0).some(p => p[1] < 4.2)) continue;
    if (F.some(f => Math.abs(f.t - t0) < 3*H && (f.kind === 'meal_late' || f.kind === 'meal_spike'))) { continue; }
    const hr = new Date(t0).getHours(); const wk = wkIn(t0 - 60*MIN, t1);
    const causes = [];
    if (wk.length) causes.push(`Интенсивная нагрузка (${wk[0].type}): при силовых и интервальных тренировках глюкоза может временно расти из-за гормонов стресса.`);
    causes.push('Еда или напиток без записи в дневник (перекус, кофе с сахаром, фрукт), возможно — без укола.');
    if (hr >= 3 && hr < 9) causes.push('Рассветный феномен: утренний выброс гормонов повышает глюкозу без еды.');
    causes.push('Стресс, волнение (важное совещание, выступление) или начало простуды.');
    add({kind:'unannounced', sev:1, t:t0, a:t0 - 60*MIN, ser:ser(t0 - 60*MIN, t0 + 240*MIN), mk:marks(t0 - 60*MIN, t0 + 240*MIN), title:'Подъём без записанной еды', what:`С ${hm(t0)} за ${Math.round((t1-t0)/MIN)} мин глюкоза выросла с ${f1(v0)} до ${f1(v1)}, а еда в дневнике не записана.`, causes, check:['Ели или пили ли вы что-то в это время, не записав в дневник?']});
    while (i < G.length && G[i][0] < t0 + 3*H) i++;
  }

  /* --- 4. long highs --- */
  let hr0 = null;
  const closeHigh = (s, e) => {
    if (e - s < 150*MIN) return;
    const v0 = at(s), v1 = at(e), insD = ins(s, e), cov = covered(s), noIns = cov && !I.some(x => x.t >= s - 30*MIN && x.t < e);
    const causes = [];
    if (!cov){
      causes.push('Недооценённые углеводы или еда без укола незадолго до подъёма.', 'Пропущенный или «закончившийся» длинный инсулин — особенно если высокий сахар держится к концу суток перед очередной инъекцией.', 'Испорченный инсулин в ручке (перегрев, мороз, истёк срок после вскрытия), если коррекции не помогали.', 'Болезнь, воспаление или стресс.');
      add({kind:'high', sev:2, nocov:true, t:s, a:s - 60*MIN, ser:ser(s - 60*MIN, e + 60*MIN), mk:marks(s - 60*MIN, e + 60*MIN), title:'Длительная высокая глюкоза', what:`Выше 13,9 с ${hm(s)} до ${hm(e)} (${Math.round((e-s)/MIN)} мин), максимум ${f1(Math.max(...range(s, e+1).map(p => p[1])))}. ${NOCOV}`, causes, check:['Помните, что было в этот день: еда, болезнь, пропуск укола?']});
      return;
    }
    const rap = I.filter(x => x.kind === 'bolus' && x.t >= s - 60*MIN && x.t < e);
    const lastLong = I.filter(x => x.kind === 'basal' && x.t < s).pop();
    const longAgo = lastLong ? (s - lastLong.t) / H : null;
    let sev = 2;
    if (rap.length && v1 >= v0 - 1){ sev = 3; causes.push(`Были уколы короткого инсулина (${fU(rap.reduce((a, x) => a + x.u, 0))} ед), но глюкоза не снижалась — возможен испорченный инсулин в ручке (перегрев, мороз, истёк срок после вскрытия), укол в уплотнение (липодистрофию) или вытекание инсулина. Проверьте кетоны.`); }
    if (!rap.length) causes.push('Во время подъёма нет записей о коррекции коротким инсулином.');
    if (longAgo != null && longAgo > 22) causes.push(`Последняя запись о длинном инсулине — ${Math.round(longAgo)} ч назад: если доза пропущена или её действие заканчивается, сахар растёт без еды.`);
    else if (longAgo == null) causes.push('Нет записей о длинном инсулине — если доза пропущена, это объясняет долгий высокий сахар.');
    causes.push('Недооценённые углеводы или еда без укола незадолго до подъёма.');
    causes.push('Болезнь, воспаление или стресс повышают потребность в инсулине.');
    add({kind:'high', sev, t:s, a:s - 60*MIN, ser:ser(s - 60*MIN, e + 60*MIN), mk:marks(s - 60*MIN, e + 60*MIN), title:'Длительная высокая глюкоза', what:`Выше 13,9 с ${hm(s)} до ${hm(e)} (${Math.round((e-s)/MIN)} мин), максимум ${f1(Math.max(...range(s, e+1).map(p => p[1])))}.`, causes, check:['Проверьте кетоны, если глюкоза держится высокой несколько часов.','Когда открыта ручка с инсулином и как она хранилась?']});
  };
  for (const p of G){ if (p[1] > 13.9){ if (hr0 && p[0] - hr0.e <= 20*MIN) hr0.e = p[0]; else { if (hr0) closeHigh(hr0.s, hr0.e); hr0 = {s:p[0], e:p[0]}; } } }
  if (hr0) closeHigh(hr0.s, hr0.e);

  /* --- KPIs --- */
  const vals = G.map(p => p[1]); const n = vals.length; const mean = vals.reduce((a, b) => a + b, 0) / n;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b-mean)**2, 0) / n);

    const dlt = av(h2) - av(h1); if (Math.abs(dlt) >= 5) P.push({sev: dlt > 0 ? 0 : 1, text:`Во второй половине периода время в диапазоне ${dlt > 0 ? 'выросло' : 'снизилось'} на <b>${Math.round(Math.abs(dlt))}</b> п.п. (${Math.round(av(h1))}% → ${Math.round(av(h2))}%).`});
    const fullDays = k.D.filter(d => startDay(d.d) < startDay(Date.now()) && Number.isFinite(d.tir) && d.bins15 >= 77 && d.spanHours >= 22 && d.maxGapMinutes <= 30);
    if (fullDays.length >= 2){
      const best = fullDays.reduce((a, d) => d.tir > a.tir ? d : a), worst = fullDays.reduce((a, d) => d.tir < a.tir ? d : a);
      P.push({sev:0, text:`Среди завершённых календарных дней лучший — <b>${new Date(best.d).toLocaleDateString('ru-RU', {day:'numeric', month:'long'})}</b> (${Math.round(best.tir)}% в диапазоне), самый сложный — <b>${new Date(worst.d).toLocaleDateString('ru-RU', {day:'numeric', month:'long'})}</b> (${Math.round(worst.tir)}%). В сравнении участвуют только завершённые дни с данными минимум в 77 из 96 пятнадцатиминутных интервалов и охватом не менее 22 часов. Дополнительно исключены дни с разрывами между соседними измерениями более 30 минут. Это фильтр качества для сравнения дней, а не оценка общего покрытия CGM.`});

    const [m, n2] = Object.entries(bm).sort((a, b) => b[1] - a[1])[0]; P.push({sev:1, text:`<b>${ri.length}</b> резких подъёмов за период, больше всего — в районе ${m} (${n2}). Если вернуть такие подъёмы в диапазон не удаётся за 2 часа, обсудите с врачом, за сколько минут до еды делать укол.`}); }

      P.push({sev: after / o2.length > .3 ? 2 : 0, text:`Укол короткого инсулина относительно еды: обычно ${med < -2 ? `за <b>${-med} мин до</b>` : med > 2 ? `через <b>${med} мин после</b>` : '<b>одновременно</b> с'} едой. После еды — в <b>${after} из ${o2.length}</b> случаев, заранее (за 10+ мин) — в ${before15}. ${after / o2.length > .3 ? 'Уколы после еды часто дают быстрый подъём — время укола стоит обсудить с врачом.' : ''}`}); }

    const fs = k.mdi.fasting; if (fs.length >= 5){ const hi = fs.filter(v => v > 8).length, lo = fs.filter(v => v < 4.5).length;
      if (hi >= 3) P.push({sev:2, text:`Утром натощак (6–7 ч) глюкоза выше 8 в <b>${hi} из ${fs.length}</b> дней. Повторяющийся высокий утренний сахар — главный вопрос к врачу о длинном инсулине и вечернем режиме.`});
      if (lo >= 2) P.push({sev:3, text:`Утром натощак глюкоза ниже 4,5 в <b>${lo} из ${fs.length}</b> дней — покажите эти утра врачу.`}); }
    const nb = F.filter(f => f.kind === 'nobolus').length; if (nb >= 2) P.push({sev:1, text:`<b>${nb}</b> приёмов пищи без записанного укола короткого инсулина.`});
  }

  return P.sort((a, b) => b.sev - a.sev);

function analyzeLoop(raw){

  const I = raw.I.sort((a, b) => a.t - b.t);
  const Cr = raw.C.sort((a, b) => a.t - b.t); const C = [];
  for (const c of Cr){ const l = C[C.length-1]; if (l && c.t - l.t < 20*MIN) l.g += c.g; else C.push({t:c.t, g:c.g}); }
  const W = raw.W.sort((a, b) => a.t - b.t);
  const T = G.map(p => p[0]);

  const at = (t, tol = 12*MIN) => { const i = lb(t); let best = null, bd = tol; for (const j of [i-1, i]) if (j >= 0 && j < T.length && Math.abs(T[j]-t) <= bd){ bd = Math.abs(T[j]-t); best = G[j][1]; } return best; };

  const marks = (a, b) => ({c: carbsIn(a, b).map(c => [Math.round((c.t-a)/MIN), Math.round(c.g)]), b: I.filter(x => x.kind === 'bolus' && x.t >= a && x.t < b && x.u >= 0.3).map(x => [Math.round((x.t-a)/MIN), Math.round(x.u*10)/10]), w: wkIn(a, b).map(w => [Math.round((Math.max(w.t, a)-a)/MIN), Math.round((Math.min(w.e, b)-a)/MIN)])});

  const add = f => { f.id = 'f' + f.t + f.kind; f.block = block(f.t); F.push(f); };

    const win = range(c.t, c.t + 240*MIN); if (win.length < 12) continue;

    const facts = [`Введено ${cg} г углеводов`, bl.length ? `болюс ${fU(bU)} ед ${bOff < -2 ? `за ${-bOff} мин до ввода углеводов` : bOff > 2 ? `через ${bOff} мин после ввода углеводов` : 'одновременно с вводом углеводов'}` : 'ручной болюс рядом с едой не найден (возможно, болюс сделала петля автоматически)', `глюкоза до еды ${f1(pre)}`];
    if (lowMin != null){
      const causes = [];

      if (rise >= 2) causes.push('Тип всасывания, вероятно, указан длиннее реального или еда была быстрой: углеводы усвоились, а инсулин продолжил действовать.');

        else if (bOff == null || bOff > -10) causes.push('Болюс без запаса времени: для этого блюда инсулину не хватило форы (обсудите с врачом время пре-болюса).');

        else causes.push('Количество углеводов, похоже, оценено верно: через 2 часа глюкоза вернулась.');

      }

  }

      else causes.push('Коррекционный болюс оказался избыточным: в момент коррекции в организме, вероятно, ещё был активный инсулин, или высокий сахар был вызван временной причиной (стресс, поздний подъём после еды).'); }

      const best = fullDays.reduce((a, d) => d.tir > a.tir ? d : a), worst = fullDays.reduce((a, d) => d.tir < a.tir ? d : a);

    const [m, n2] = Object.entries(bm).sort((a, b) => b[1] - a[1])[0]; P.push({sev:1, text:`<b>${ri.length}</b> резких подъёмов за период, больше всего — в районе ${m} (${n2}). Если вернуть такие подъёмы в диапазон не удаётся за 2 часа, обсудите с врачом время пре-болюса.`}); }

}

function demoData(){
  const out = {G:[], I:[], C:[], W:[], src:{'Демо':1}}; let s = 11; const r = () => (s = (s*16807) % 2147483647) / 2147483647;
  const start = new Date(); start.setHours(0,0,0,0); const t0 = start.getTime() - 13*864e5;
  const ev = []; // [timeOffsetMin, delta curve fn]
  const effects = [];
  for (let d = 0; d < 14; d++){
    const day = t0 + d*864e5;
    const late = d % 3 === 0;   // late bolus at breakfast
    const bk = day + (8*60 + Math.round(r()*30))*MIN;
    out.C.push({t:bk, g:45}); out.I.push({t: bk + (late ? 20 : -10)*MIN, u:4.5, kind:'bolus'});
    effects.push({t:bk, peak: late ? 6 : 3, tp: late ? 50 : 60, dur:180});
    const ln = day + 13*H; out.C.push({t:ln, g:60}); out.I.push({t:ln - 5*MIN, u:5.5, kind:'bolus'}); effects.push({t:ln, peak:2.5, tp:70, dur:200});
    const dn = day + 19*H + 30*MIN; const pizza = d % 4 === 1;
    out.C.push({t:dn, g: pizza ? 70 : 50}); out.I.push({t:dn - 5*MIN, u: pizza ? 6 : 5, kind:'bolus'});
    effects.push({t:dn, peak: pizza ? 5.5 : 2.5, tp: pizza ? 190 : 70, dur: pizza ? 330 : 200});
    if (d % 5 === 2){ out.I.push({t: day + 22*H, u:2.5, kind:'bolus'}); effects.push({t: day + 22*H, peak:-5.2, tp:240, dur:330}); }
    if (d % 6 === 4){ out.W.push({t: day + 18*H, e: day + 19*H, type:'плавание'}); effects.push({t: day + 18*H + 30*MIN, peak:-2.5, tp:80, dur:180}); effects.push({t: day + 26*H, peak:-4.4, tp:90, dur:200}); }
    if (d % 4 === 3){ effects.push({t: day + 16*H, peak:4, tp:45, dur:150}); }
    if (d === 9){ effects.push({t: day + 10*H, peak:10, tp:220, dur:480}); }
    if (d !== 11) out.I.push({t: day + (22*60 + Math.round(r()*80 - 40))*MIN, u: 18, kind:'basal'});
  }
  for (let m = 0; m < 14*1440; m += 5){
    const t = t0 + m*MIN; const h = (m % 1440)/60;
    let v = 6.3 + (h > 4 && h < 8 ? (h-4)*0.35 : h >= 8 && h < 10 ? 1.4 - (h-8)*0.7 : 0);
    for (const e of effects){ const x = (t - e.t)/MIN; if (x < 0 || x > e.dur) continue; v += x < e.tp ? e.peak * Math.sin(x/e.tp*Math.PI/2) : e.peak * Math.cos((x-e.tp)/(e.dur-e.tp)*Math.PI/2); }
    if (out._hypoTreat){}
    v += (r() - .5) * 0.35; out.G.push([t, Math.max(2.4, v)]);
  }
  // rebound after hypo treatment: overtreated lows
  for (const e of effects.filter(e => e.peak < -4)){ const tt = e.t + (e.tp + 10)*MIN; for (const p of out.G){ const x = (p[0]-tt)/MIN; if (x > 0 && x < 180) p[1] += 6.5*Math.sin(Math.min(1, x/70)*Math.PI/2) * (x > 70 ? Math.max(0, 1 - (x-70)/110) : 1); } }
  return out;
}

function summarizeMealPatterns(items){
  const groups=new Map();
  for(const x of (items||[])){
    const e=x&&x.evidence;
    if(!e||x.confidence!=='ограниченная'||!e.curve||e.curve.pattern==='не определён'||
      !Number.isFinite(e.carbsGrams)||!Number.isFinite(e.mealTime)||!Number.isFinite(e.baseline))continue;
    if(e.otherMealInWindow||e.multipleBoluses||e.preMealRise||e.activityCount>0)continue;
    const band=Math.floor(e.carbsGrams/20)*20;
    const baselineBand=Math.floor(e.baseline/2)*2;
    const hour=new Date(e.actualMealTime===null?e.mealTime:e.actualMealTime).getHours();
    const period=hour>=5&&hour<11?'утро':hour>=11&&hour<17?'день':hour>=17&&hour<23?'вечер':'ночь';
    const bolusContext=e.bolusCount===1?'один зарегистрированный болюс':e.bolusCount===0?'болюс не зарегистрирован':'неизвестно';
    const timeStatus=e.actualMealTime===null?'начало еды не уточнено':'начало еды уточнено';
    const key=[band,baselineBand,period,bolusContext,timeStatus].join('|');
    if(!groups.has(key))groups.set(key,{band,baselineBand,period,bolusContext,timeStatus,dates:new Set(),total:0,patterns:new Map()});
    const g=groups.get(key);
    g.total++;
    g.dates.add(new Date(e.mealTime).toLocaleDateString('sv-SE'));
    const p=e.curve.pattern;
    if(!g.patterns.has(p))g.patterns.set(p,{count:0,dates:new Set()});
    g.patterns.get(p).count++;
    g.patterns.get(p).dates.add(new Date(e.mealTime).toLocaleDateString('sv-SE'));
  }
  const results=[];
  for(const g of groups.values()){
    for(const [pattern,p] of g.patterns){
      if(p.count<3||p.dates.size<3)continue;
      const percent=Math.round(100*p.count/g.total);
      results.push({band:g.band,baselineBand:g.baselineBand,period:g.period,bolusContext:g.bolusContext,
        timeStatus:g.timeStatus,pattern,count:p.count,total:g.total,percent,days:p.dates.size,
        consistency:percent>=75?'часто в сопоставимых эпизодах':percent>=50?'в части сопоставимых эпизодов':'редко в сопоставимых эпизодах'});
    }
  }
  return results.sort((a,b)=>b.percent-a.percent||b.total-a.total||b.count-a.count).slice(0,5);
}

    const answer=prompt('Через сколько минут после записи углеводов вы фактически начали есть? 0–120. Оставьте пустым, чтобы убрать уточнение.',existing==null?'':String(existing));
    if(answer===null)return;
    const val=answer.trim();
    const map={...(S.set.mealStartOffsets||{})};
    if(!val)delete map[String(t)];
    else if(!/^\d+$/.test(val)||Number(val)>120){toast('Укажите целое число минут от 0 до 120');return;}
    else map[String(t)]=Number(val);
    S.set.mealStartOffsets=map;persist('settings');S.dirty=true;render();
  }
  else if (a === 'rng-reset'){ delete S.set.rLo; delete S.set.rHi; persist('settings'); S.dirty = true; render(); toast('Целевой диапазон: 3,9–10,0'); }
  else if (a === 'goep' || a === 'goblk'){ S.tab = 'find'; S.epv = 'list'; S.dayF = null; if (a === 'goep'){ S.filter = b; S.blockF = null; } else { S.filter = 'all'; S.blockF = b; } render(); goToList(); }
  else if (a === 'clrblk'){ S.blockF = null; render(); }
  else if (a === 'insv'){ S.insView = 'avg'; render(); }
  else if (a === 'report'){ if (gated('report')){ S.tab = 'pro'; render(); window.scrollTo(0, 0); } else saveDoctorReport(); }
  else if (a === 'key-go') activateKey(($('#keyIn') || {}).value);
  else if (a === 'key-off'){ const b2 = $('#keyOff'); if (!b2.dataset.arm){ b2.dataset.arm = 1; b2.textContent = 'Нажмите ещё раз для отключения'; return; } delete S.set.license; S.pro = null; persist('settings'); S.dirty = true; render(); toast('PRO отключён на этом устройстве.'); }
  else if (a === 'tbl-go') runTableImport();
  else if (a === 'nsync') nativeSync(true);
  else if (a === 'bk-load') $('#bkIn').click();
  else if (a === 'wipe'){ const btn = $('#wipeBtn'); if (!btn.dataset.arm){ btn.dataset.arm = 1; btn.textContent = 'Нажмите ещё раз — данные будут удалены безвозвратно'; return; } idb.clear().then(() => location.reload()); }

  else if (a === 'days' && +b > FREE_DAYS && gated('longPeriods')){ toast('Анализ за 30 и 90 дней и за свой период доступен в PRO.'); S.tab = 'pro'; render(); window.scrollTo(0, 0); }
  else if (a === 'days'){ S.set.days = +b; persist('settings'); S.dirty = true; const y0 = window.scrollY; render(); if (S.tab !== 'diary') window.scrollTo(0, Math.min(y0, 0)); }
  else if (a === 'new'){ S.sheet = {type:b}; openSheetUI(); }
  else if (a === 'edit'){ const e = store().entries.find(x => x.id === b); if (e){ S.sheet = {type:e.type, e}; openSheetUI(); } }
  else if (a === 'save-entry') saveEntry();
  else if (a === 'close-sheet'){ S.sheet = null; closeSheetUI(); }
  else if (a === 'del-entry'){ const btn = $('#delBtn'); if (!btn.dataset.arm){ btn.dataset.arm = 1; btn.textContent = 'Нажмите ещё раз'; return; } const st = store(); const e = S.sheet.e; st.entries.splice(st.entries.findIndex(x => x.id === e.id), 1); persist('e-' + ymKey(e.t)); S.dirty = true; S.sheet = null; closeSheetUI(); render(); }
  else if (a === 'tshift'){ const d = new Date(Date.now() + (+b)*MIN); $('#fT').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  else if (a === 'fill'){ $('#fName').value = el.dataset.n; $('#fG').value = S.set.carb === 'xe' ? fU(+el.dataset.g / S.set.xe) : Math.round(+el.dataset.g); }
  else if (a === 'fillu'){ $('#fU').value = fU(+el.dataset.u); }
  else if (a === 'dprev'){ S.day = startDay((S.day || startDay(Date.now())) - 12*H); render(); }
  else if (a === 'dnext'){ S.day = Math.min(startDay(Date.now()), startDay((S.day || startDay(Date.now())) + 36*H)); render(); }
  else if (a === 'demo-exit'){ S.tour = null; S.demoStore = null; S.demo = false; S.res = null; S.notes = {}; S.chat = []; S.ai = ''; S.dirty = true; S.tab = 'diary'; S.day = null; loadReviewOnly(); }
  else if (a === 'pick') $('#fileIn').click();
  else if (a === 'tour-next') tourGo(S.tour + 1);
  else if (a === 'tour-end'){ S.tour = null; tourPaint(); document.querySelectorAll('.tour-hl').forEach(e => e.classList.remove('tour-hl')); }
  else if (a === 'tour-own'){ S.tour = null; S.demoStore = null; S.demo = false; S.res = null; S.notes = {}; S.chat = []; S.ai = ''; S.dirty = true; S.tab = 'diary'; S.day = null; delete S.set.wizSkip; persist('settings'); loadReviewOnly(); window.scrollTo(0, 0); }
  else if (a === 'wiz'){ ev.preventDefault(); if (b) S.set.wiz = b; else delete S.set.wiz; persist('settings'); render(); window.scrollTo(0, 0); }
  else if (a === 'wiz-skip'){ ev.preventDefault(); S.set.wizSkip = true; persist('settings'); render(); }
  else if (a === 'demo'){ const dd = demoData(); const gl = {}; for (const [t, v] of dd.G) (gl[ymKey(t)] = gl[ymKey(t)] || []).push([Math.round(t/60000), Math.round(v*10)]);
    const entries = dd.I.map(x => ({id:uid(), t:x.t, type: x.kind === 'basal' ? 'long' : 'rapid', u:x.u, src:'manual'})).concat(dd.C.map(c => ({id:uid(), t:c.t, type:'carbs', g:c.g, src:'manual'}))).concat(dd.W.map(w => ({id:uid(), t:w.t, e:w.e, type:'act', note:w.type, src:'manual'}))).sort((p, q) => p.t - q.t);
    S.set.sawDemo = true; persist('settings'); S.demoStore = {gl, entries}; S.demo = true; S.notes = {}; S.ai = ''; S.chat = []; S.dayF = null; S.filter = 'all'; S.dirty = true; runAnalysis(); tourGo(0); }
  else if (a === 'flt'){ S.blockF = null; }
  if (a === 'flt'){ S.filter = b; S.epv = 'list'; render(); }
  else if (a === 'vote'){ const n = S.notes[b] || (S.notes[b] = {}); n.v = n.v === c ? null : c; render(); saveSoon(); }
  else if (a === 'ai') runAI();
  else if (a === 'epv'){ S.epv = b; render(); }
  else if (a === 'day'){ S.dayF = b; S.epv = 'list'; S.filter = 'all'; render(); window.scrollTo(0, 0); }
  else if (a === 'clrday'){ S.dayF = null; render(); }
  else if (a === 'ask'){ const q = ($('#askIn') || {}).value || ''; ask(q, S.askEp); S.askEp = null; }
  else if (a === 'sugg'){ S.draft = el.dataset.q; S.askEp = null; render(); const t = $('#askIn'); if (t) t.focus(); }
  else if (a === 'askep'){ const f = S.res.F.find(x => x.id === b); if (f){ S.askEp = b; S.draft = `Разберите эпизод «${f.title}» ${dRu(f.t)} в ${hm(f.t)}: что, скорее всего, произошло и что мне проверить?`; S.tab = 'ai'; render(); window.scrollTo(0, document.body.scrollHeight); } }
  else if (a === 'chat-clear'){ S.chat = []; saveResult(); render(); }
  else if (a === 'ai-stop'){ if (aiCtl) aiCtl.abort(); }
});
document.addEventListener('focusin', ev => { const t = ev.target; if (t.dataset && t.dataset.rng && !t.disabled){ t.dataset.old = t.value; t.placeholder = t.value; t.value = ''; } });
document.addEventListener('focusout', ev => { const t = ev.target; if (t.dataset && t.dataset.rng && t.value.trim() === '' && t.dataset.old) t.value = t.dataset.old; });
document.addEventListener('change', ev => { if (ev.target.dataset && ev.target.dataset.pr){ const k2 = ev.target.dataset.pr, v = ev.target.value; if (!v) return;
    const nf = k2 === 'from' ? v : S.set.pFrom, nt = k2 === 'to' ? v : S.set.pTo;
    if (fromIsoD(nf) > fromIsoD(nt)){ toast('Начало периода должно быть раньше конца.'); ev.target.value = k2 === 'from' ? S.set.pFrom : S.set.pTo; return; }
    S.set.pFrom = nf; S.set.pTo = nt; persist('settings'); S.dirty = true; render(); return; } if (ev.target.dataset.rng){ if (gated('customRange')) return; const lo = ev.target.dataset.rng === 'lo' ? num(ev.target.value) : RLO(), hi = ev.target.dataset.rng === 'hi' ? num(ev.target.value) : RHI();
    if (!(lo >= 3.5 && lo <= 6.5) || !(hi >= 7 && hi <= 13) || hi - lo < 2){ toast('Нижняя граница — от 3,5 до 6,5, верхняя — от 7,0 до 13,0, разница не меньше 2 ммоль/л.', 6000); ev.target.value = f1(ev.target.dataset.rng === 'lo' ? RLO() : RHI()); return; }
    S.set.rLo = Math.round(lo*10)/10; S.set.rHi = Math.round(hi*10)/10; persist('settings'); S.dirty = true; if (S.tab !== 'set') render(); else { const rb = document.getElementById('rngReset'); if (rb) rb.hidden = !RCUST(); } toast(`Целевой диапазон: ${f1(S.set.rLo)}–${f1(S.set.rHi)}`); return; } if (ev.target.dataset.insday != null){ if (ev.target.value){ S.insView = ev.target.value; const y0 = window.scrollY; render(); window.scrollTo(0, y0); } return; } if (ev.target.dataset.trole != null){ S.tbl.roles[+ev.target.dataset.trole] = ev.target.value; openSheetUI(); return; } if (ev.target.id === 'tCarb'){ S.tbl.carbUnit = ev.target.value; openSheetUI(); return; } if (ev.target.dataset.setb){ S.set[ev.target.dataset.setb] = ev.target.checked; persist('settings'); return; } const k2 = ev.target.dataset.set; if (!k2) return; if (k2 === 'mode'){ S.set.mode = ev.target.value; persist('settings'); S.dirty = true; render(); return; } let v = ev.target.value; if (k2 === 'xe'){ v = num(v); if (!(v >= 8 && v <= 20)) { toast('Укажите от 8 до 20 г в 1 ХЕ'); return; } } S.set[k2] = v; persist('settings'); render(); });
document.addEventListener('input', ev => { if (ev.target.id === 'askIn') S.draft = ev.target.value; const id = ev.target.dataset.note; if (id){ (S.notes[id] = S.notes[id] || {}).c = ev.target.value.slice(0, 300); saveSoon(); } });
$('#fileIn').addEventListener('change', ev => { const fs = [...ev.target.files]; ev.target.value = ''; if (fs.length) importFiles(fs); });

async function loadReviewOnly(){ render(); }
$('#overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay'){ S.sheet = null; closeSheetUI(); } });
async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  try { await loadAll(); } catch(e){ console.error(e); toast('Не удалось загрузить данные с устройства.'); }
  S.loaded = true;
  if (S.set.license){ try { S.pro = await verifyKey(S.set.license); } catch(e){} }
  const hk = /[#&]key=([^&]+)/.exec(location.hash); if (hk){ try { history.replaceState(null, '', location.pathname); } catch(e){} await activateKey(decodeURIComponent(hk[1])); S.tab = 'pro'; render(); }
  window.addEventListener('hashchange', async () => { const h2 = /[#&]key=([^&]+)/.exec(location.hash); if (!h2) return; try { history.replaceState(null, '', location.pathname); } catch(e){} await activateKey(decodeURIComponent(h2[1])); S.tab = 'pro'; render(); });
  S.dirty = true; render();
  apkCheck(); nativeSync(false); hcRead(false); nsSync(false); document.addEventListener('visibilitychange', () => { if (!document.hidden){ nativeSync(false); hcRead(false); nsSync(false); if (S.scWait) render(); } });
  setInterval(() => { if (!document.hidden) nsSync(false); }, 5*60000);
  if ('serviceWorker' in navigator && !window.AndroidBridge && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}

render(); init();
